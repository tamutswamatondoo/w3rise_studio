<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <!-- Deep Chocopie Ground -->
  <rect width="800" height="500" fill="#2d1f1e"/>
  
  <!-- Atmospheric Blue Layer -->
  <circle cx="500" cy="200" r="260" fill="#c4dae8" fill-opacity="0.14" filter="blur(45px)"/>
  
  <!-- Autonomous Telemetry Network Visual -->
  <g stroke="#c4dae8" stroke-width="1.2" stroke-opacity="0.3">
    <!-- Isometric Grid Surface -->
    <path d="M100 350 L400 200 L700 350 L400 500 Z"/>
    <path d="M160 350 L400 230 L640 350 L400 470 Z"/>
    <path d="M220 350 L400 260 L580 350 L400 440 Z"/>
    <path d="M280 350 L400 290 L520 350 L400 410 Z"/>
  </g>

  <!-- Constellation Nodes & Butter Connectors -->
  <line x1="250" y1="220" x2="400" y2="140" stroke="#feefb8" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="400" y1="140" x2="580" y2="210" stroke="#c4dae8" stroke-width="1.5"/>
  <line x1="400" y1="140" x2="400" y2="290" stroke="#feefb8" stroke-width="2"/>
  
  <!-- Floating Telemetry Badges -->
  <circle cx="400" cy="140" r="10" fill="#feefb8"/>
  <circle cx="400" cy="140" r="22" stroke="#feefb8" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="250" cy="220" r="6" fill="#c4dae8"/>
  <circle cx="580" cy="210" r="7" fill="#c4dae8"/>
  
  <text x="40" y="60" font-family="'JetBrains Mono', monospace" font-size="12" fill="#c4dae8" letter-spacing="4" opacity="0.7">02 / AUTONOMOUS OS</text>
  <text x="40" y="445" font-family="'Syne', sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="-1">AURA OS</text>
  <text x="40" y="470" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#feefb8" letter-spacing="1">High-Throughput Spatial Telemetry &amp; Micro-Frontends</text>
</svg>
