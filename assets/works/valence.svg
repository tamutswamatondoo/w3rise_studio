<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <!-- Deep Chocopie Ground -->
  <rect width="800" height="500" fill="#382524"/>
  
  <!-- Atmospheric Blue Accent -->
  <circle cx="450" cy="220" r="260" fill="#c4dae8" fill-opacity="0.14" filter="blur(45px)"/>
  
  <!-- Editorial High-Fashion Typography & Silhouette -->
  <rect x="180" y="80" width="440" height="340" stroke="#c4dae8" stroke-width="1.2" stroke-opacity="0.3"/>
  <rect x="220" y="110" width="360" height="280" stroke="#feefb8" stroke-width="1" stroke-opacity="0.4"/>
  
  <text x="400" y="270" font-family="'Syne', sans-serif" font-size="88" font-weight="800" fill="#feefb8" text-anchor="middle" letter-spacing="8" fill-opacity="0.9">VALENCE</text>
  <text x="400" y="315" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#c4dae8" text-anchor="middle" letter-spacing="6">AUTUMN / WINTER DIGITAL SHOWROOM</text>
  
  <!-- Corner Crop Marks -->
  <line x1="160" y1="80" x2="200" y2="80" stroke="#c4dae8" stroke-width="1"/>
  <line x1="180" y1="60" x2="180" y2="100" stroke="#c4dae8" stroke-width="1"/>
  <line x1="600" y1="420" x2="640" y2="420" stroke="#c4dae8" stroke-width="1"/>
  <line x1="620" y1="400" x2="620" y2="440" stroke="#c4dae8" stroke-width="1"/>
  
  <text x="40" y="60" font-family="'JetBrains Mono', monospace" font-size="12" fill="#c4dae8" letter-spacing="4" opacity="0.7">06 / HAUTE COUTURE</text>
  <text x="40" y="470" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#feefb8" letter-spacing="1">Headless Commerce Architecture &amp; Fluid Interaction</text>
</svg>
