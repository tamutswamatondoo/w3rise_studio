<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <!-- Deep Chocopie Ground -->
  <rect width="800" height="500" fill="#432f2e"/>
  
  <!-- Luminous Butter & Blue Radial Radiance -->
  <circle cx="400" cy="250" r="300" fill="#c4dae8" fill-opacity="0.1" filter="blur(50px)"/>
  <circle cx="400" cy="250" r="160" fill="#feefb8" fill-opacity="0.12" filter="blur(35px)"/>
  
  <!-- Kinetic Pavilion Parametric Curves -->
  <g stroke="#feefb8" stroke-width="1.8" stroke-opacity="0.7">
    <ellipse cx="400" cy="250" rx="260" ry="120" transform="rotate(25 400 250)"/>
    <ellipse cx="400" cy="250" rx="240" ry="100" transform="rotate(45 400 250)"/>
    <ellipse cx="400" cy="250" rx="220" ry="80" transform="rotate(65 400 250)"/>
    <ellipse cx="400" cy="250" rx="200" ry="60" transform="rotate(85 400 250)"/>
  </g>
  <g stroke="#c4dae8" stroke-width="1.2" stroke-opacity="0.4">
    <ellipse cx="400" cy="250" rx="280" ry="140" transform="rotate(5 400 250)"/>
    <ellipse cx="400" cy="250" rx="300" ry="150" transform="rotate(-15 400 250)"/>
  </g>
  
  <circle cx="400" cy="250" r="18" fill="#feefb8"/>
  
  <text x="40" y="60" font-family="'JetBrains Mono', monospace" font-size="12" fill="#c4dae8" letter-spacing="4" opacity="0.7">04 / KINETIC SPATIAL</text>
  <text x="40" y="445" font-family="'Syne', sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="-1">SOLARIS PAVILION</text>
  <text x="40" y="470" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#feefb8" letter-spacing="1">Dynamic Architectural Identity &amp; WebGL Immersion</text>
</svg>
