<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <!-- Deep Chocopie Ground -->
  <rect width="800" height="500" fill="#432f2e"/>
  
  <!-- Atmospheric Blue Ambient Glow -->
  <circle cx="400" cy="250" r="280" fill="#c4dae8" fill-opacity="0.12" filter="blur(40px)"/>
  <circle cx="560" cy="180" r="140" fill="#feefb8" fill-opacity="0.08" filter="blur(30px)"/>
  
  <!-- Architectural Chronograph Dials -->
  <circle cx="400" cy="250" r="180" stroke="#c4dae8" stroke-width="1.5" stroke-opacity="0.35"/>
  <circle cx="400" cy="250" r="140" stroke="#c4dae8" stroke-width="1" stroke-dasharray="4 6" stroke-opacity="0.45"/>
  <circle cx="400" cy="250" r="90" stroke="#feefb8" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <!-- Dial Sub-rings -->
  <circle cx="340" cy="220" r="45" stroke="#c4dae8" stroke-width="1.2" stroke-opacity="0.4"/>
  <circle cx="460" cy="220" r="45" stroke="#c4dae8" stroke-width="1.2" stroke-opacity="0.4"/>
  <circle cx="400" cy="300" r="35" stroke="#c4dae8" stroke-width="1.2" stroke-opacity="0.4"/>
  
  <!-- Mechanical Hands & Accents -->
  <line x1="400" y1="250" x2="490" y2="170" stroke="#feefb8" stroke-width="3" stroke-linecap="round"/>
  <line x1="400" y1="250" x2="310" y2="290" stroke="#c4dae8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="400" cy="250" r="6" fill="#feefb8"/>
  <circle cx="490" cy="170" r="4" fill="#feefb8"/>

  <!-- Minimalist Brand Typography Overlay -->
  <text x="40" y="60" font-family="'JetBrains Mono', monospace" font-size="12" fill="#c4dae8" letter-spacing="4" opacity="0.7">01 / CHRONOMETRY</text>
  <text x="40" y="450" font-family="'Syne', sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="-1">KRONOS HOROLOGY</text>
  <text x="40" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#feefb8" letter-spacing="1">3D Timepiece Configurator &amp; Identity System</text>
</svg>
