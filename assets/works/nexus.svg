<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <!-- Deep Chocopie Ground -->
  <rect width="800" height="500" fill="#3a2726"/>
  
  <!-- Atmospheric Blue Ambient -->
  <circle cx="280" cy="240" r="220" fill="#c4dae8" fill-opacity="0.12" filter="blur(40px)"/>
  
  <!-- Algorithmic Matrix & Waveform -->
  <path d="M50 320 Q 200 180, 400 280 T 750 160" stroke="#feefb8" stroke-width="2.5" fill="none"/>
  <path d="M50 340 Q 200 200, 400 300 T 750 180" stroke="#c4dae8" stroke-width="1.5" stroke-opacity="0.6" fill="none"/>
  <path d="M50 360 Q 200 220, 400 320 T 750 200" stroke="#c4dae8" stroke-width="1" stroke-opacity="0.3" fill="none"/>
  
  <!-- Financial Metric Pillars -->
  <rect x="220" y="160" width="28" height="180" rx="4" fill="#c4dae8" fill-opacity="0.15" stroke="#c4dae8" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="280" y="120" width="28" height="220" rx="4" fill="#c4dae8" fill-opacity="0.25" stroke="#c4dae8" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="340" y="80" width="28" height="260" rx="4" fill="#feefb8" fill-opacity="0.4" stroke="#feefb8" stroke-width="1.2"/>
  <rect x="400" y="140" width="28" height="200" rx="4" fill="#c4dae8" fill-opacity="0.2" stroke="#c4dae8" stroke-width="1" stroke-opacity="0.4"/>
  
  <text x="40" y="60" font-family="'JetBrains Mono', monospace" font-size="12" fill="#c4dae8" letter-spacing="4" opacity="0.7">03 / INSTITUTIONAL CAPITAL</text>
  <text x="40" y="445" font-family="'Syne', sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="-1">NEXUS GLOBAL</text>
  <text x="40" y="470" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#feefb8" letter-spacing="1">Quantitative Portfolio Architecture &amp; Brand Rebirth</text>
</svg>
