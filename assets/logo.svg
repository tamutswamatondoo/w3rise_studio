<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none" aria-label="W3rise Studio Logo">
  <!-- Monogram Mark -->
  <g id="mark">
    <!-- Atmospheric Blue Backing -->
    <rect x="2" y="4" width="32" height="32" rx="8" fill="#c4dae8" fill-opacity="0.35"/>
    
    <!-- Chocopie Grounded Structure (W & 3) -->
    <path d="M7 12L12 28L17 17L22 28L27 12" stroke="#432f2e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Luminous Butter Rising Dot Accent -->
    <circle cx="28" cy="11" r="3.2" fill="#feefb8" stroke="#432f2e" stroke-width="1.2"/>
  </g>
  
  <!-- Wordmark -->
  <text x="44" y="26" font-family="'Syne', system-ui, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.03em" fill="#432f2e">
    W3RISE
  </text>
  <text x="114" y="26" font-family="'Syne', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.14em" fill="#432f2e" opacity="0.65">
    STUDIO
  </text>
</svg>
